apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequireresourceslimits
spec:
  crd:
    spec:
      names:
        kind: K8sRequireResourcesLimits
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireresourceslimits
        all_containers [c] {
          c := input.review.object.spec.template.spec.containers[_]
        }
        all_containers [c] {
          c := input.review.object.spec.template.spec.initContainers[_]
        }
        violation[{"msg": msg}] {
          container := all_containers[_]
          not container.resources.limits.memory
          msg := sprintf("container <%v> does not have Memory limits declared. Please, check its respective manifest.", [container.name])
        }